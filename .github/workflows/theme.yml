name: "Thème : contrôler et déployer"

on:
  pull_request:
    paths: ['theme/**']
  push:
    branches: [main]
    paths: ['theme/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controler:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Installer Shopify CLI
        run: npm install --global @shopify/cli@3

      # Theme Check : Liquid mort, appels coûteux dans une boucle, assets
      # manquants, traductions absentes, attributs d'accessibilité.
      - name: Theme Check
        run: shopify theme check --path theme --fail-level error

      # JSON, clés de traduction, parité FR/EN, snippets et sections
      # référencés. Ce que Theme Check ne couvre pas.
      - name: Cohérence du thème
        run: node tools/verifier-theme.mjs

      # Garde-fou DA : aucune couleur en dur hors de base.css et des snippets
      # de réglages. Si quelqu'un colle un #ff0000 dans une section, la CI le
      # refuse : c'est ce qui empêche la palette de se disperser.
      # Deux exceptions documentees, aucune autre :
      #   - reglages-css.liquid est LE robinet qui transforme un reglage
      #     marchand en couleur (voir base.css).
      #   - couleur-swatch.liquid mappe des noms de variante ("Ivoire",
      #     "Nuit"...) vers une couleur d'affichage. Ce ne sont pas des
      #     couleurs d'interface a garder alignees sur la DA, ce sont des
      #     donnees produit : une teinte de plus ne fait pas deriver le
      #     theme, contrairement a une couleur d'interface en dur.
      - name: Refuser les couleurs en dur dans les sections
        run: |
          fautifs=$(grep -rEn '#[0-9a-fA-F]{3,6}\b' theme/sections theme/snippets \
            --include='*.liquid' \
            | grep -v 'reglages-css.liquid' \
            | grep -v 'couleur-swatch.liquid' \
            | grep -v 'default:' || true)
          if [ -n "$fautifs" ]; then
            echo "Couleurs en dur détectées : utiliser les variables de base.css :"
            echo "$fautifs"
            exit 1
          fi

  apercu:
    name: Thème d'aperçu (PR)
    # `vars.SHOPIFY_SHOP` vide = aucune boutique branchee sur ce depot :
    # les jobs qui parlent a Shopify sont sautes, pas mis en echec. Les
    # controles (theme check, couleurs en dur) tournent quoi qu'il arrive.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.SHOPIFY_SHOP != ''
    runs-on: ubuntu-latest
    needs: controler
    environment: boutique-theme
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - run: npm install --global @shopify/cli@3

      # Thème non publié : visible seulement via son lien d'aperçu.
      # Le nom porte le numéro de PR, donc un push successif remplace
      # l'aperçu au lieu d'empiler les thèmes.
      - name: Pousser un thème d'aperçu
        env:
          SHOPIFY_FLAG_STORE: ${{ vars.SHOPIFY_SHOP }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
        run: |
          shopify theme push \
            --path theme \
            --unpublished \
            --json \
            --theme "PR-${{ github.event.pull_request.number }}" > apercu.json
          cat apercu.json >> "$GITHUB_STEP_SUMMARY"
          echo "url=$(jq -r '.theme.preview_url' apercu.json)" >> "$GITHUB_OUTPUT"
        id: theme_apercu

      # Budgets definis dans ARCHITECTURE.md section 9. L'accessibilite est
      # bloquante (error) : une regression la est objective et imputable au
      # code. La performance reste en warn : un run sur un runner GitHub
      # partage n'a pas les conditions reseau du budget mobile 4G documente,
      # donc un score fluctuant ici ne doit pas faire echouer la PR pour de
      # mauvaises raisons. Config : .github/lighthouserc.json
      # `continue-on-error` (pas `|| true`) : le statut reel de lhci reste
      # visible dans l'onglet Checks (echec si l'accessibilite regresse),
      # mais n'empeche pas le reste du workflow de continuer.
      - name: Lighthouse CI sur le thème d'aperçu
        continue-on-error: true
        run: |
          npm install --global @lhci/cli@0.14
          lhci autorun \
            --collect.url="${{ steps.theme_apercu.outputs.url }}" \
            --config=.github/lighthouserc.json

  deployer:
    name: Publier sur la boutique
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SHOPIFY_SHOP != ''
    runs-on: ubuntu-latest
    needs: controler
    environment: boutique-production   # relecture obligatoire
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - run: npm install --global @shopify/cli@3

      # Partage de propriété assumé :
      #   - le code (liquid, assets, locales) appartient au dépôt et est
      #     poussé à chaque déploiement ;
      #   - les JSON que le marchand édite dans l'éditeur de thème
      #     (settings_data, gabarits JSON, groupes de sections) appartiennent
      #     à la boutique et ne sont jamais écrasés depuis la CI.
      # Ils reviennent dans le dépôt via le job `sauvegarder` ci-dessous,
      # qui garde Git comme copie de secours.
      - name: Pousser le thème publié
        env:
          SHOPIFY_FLAG_STORE: ${{ vars.SHOPIFY_SHOP }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
        run: |
          shopify theme push \
            --path theme \
            --live \
            --allow-live \
            --ignore 'config/settings_data.json' \
            --ignore 'templates/*.json' \
            --ignore 'sections/*-groupe.json'

  sauvegarder:
    name: Sauvegarder les réglages marchand
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SHOPIFY_SHOP != ''
    runs-on: ubuntu-latest
    needs: deployer
    environment: boutique-theme
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - run: npm install --global @shopify/cli@3

      - name: Récupérer les JSON édités en boutique
        env:
          SHOPIFY_FLAG_STORE: ${{ vars.SHOPIFY_SHOP }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
        run: |
          shopify theme pull \
            --path theme \
            --live \
            --only 'config/settings_data.json' \
            --only 'templates/*.json' \
            --only 'sections/*-groupe.json'

      - name: Archiver
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: reglages-boutique-${{ github.run_id }}
          path: |
            theme/config/settings_data.json
            theme/templates/*.json
            theme/sections/*-groupe.json
          retention-days: 180
